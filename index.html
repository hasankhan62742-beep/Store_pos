<!DOCTYPE html>
<html lang="ur" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Store Entry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh;
    background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, #0f0a2e 45%, #060314 100%);
    color: #e2e8f0;
    padding: 20px 16px 60px;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    z-index: 0;
  }
  body::before {
    width: 280px; height: 280px;
    background: #7c3aed;
    top: -80px; left: -60px;
  }
  body::after {
    width: 260px; height: 260px;
    background: #06b6d4;
    bottom: -60px; right: -60px;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 440px;
    margin: 0 auto;
  }

  .header {
    text-align: center;
    margin-bottom: 24px;
    padding-top: 8px;
  }
  .header .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(124, 58, 237, 0.15);
    border: 1px solid rgba(124, 58, 237, 0.4);
    color: #c4b5fd;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 5px 12px;
    border-radius: 20px;
    margin-bottom: 12px;
  }
  .header h1 {
    font-family: 'Poppins', sans-serif;
    font-size: 26px;
    font-weight: 800;
    background: linear-gradient(135deg, #ffffff 0%, #c4b5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    font-size: 13px;
    color: #8b8ba7;
    margin-top: 4px;
  }

  .card {
    background: rgba(255, 255, 255, 0.04);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 24px;
    padding: 24px 20px;
    box-shadow:
      0 8px 32px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .field {
    margin-bottom: 16px;
    position: relative;
  }
  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: #a5b4fc;
    margin-bottom: 7px;
    letter-spacing: 0.3px;
    text-transform: uppercase;
  }
  .input-wrap {
    position: relative;
  }
  .input-wrap .icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 16px;
    opacity: 0.6;
    pointer-events: none;
  }
  input {
    width: 100%;
    padding: 14px 14px 14px 40px;
    border-radius: 14px;
    border: 1.5px solid rgba(255, 255, 255, 0.08);
    background: rgba(255, 255, 255, 0.03);
    color: #f8fafc;
    font-size: 16px;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
    transition: all 0.25s ease;
  }
  input::placeholder { color: #565676; }
  input:focus {
    outline: none;
    border-color: #8b5cf6;
    background: rgba(139, 92, 246, 0.08);
    box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12);
  }

  .row { display: flex; gap: 12px; }
  .row .field { flex: 1; }

  .preview {
    margin-top: 18px;
    padding: 16px;
    background: linear-gradient(135deg, rgba(139, 92, 246, 0.12), rgba(6, 182, 212, 0.10));
    border: 1px solid rgba(139, 92, 246, 0.25);
    border-radius: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .preview .item { text-align: center; flex: 1; }
  .preview .item .lbl {
    font-size: 10px;
    color: #9ca3d1;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    font-weight: 600;
  }
  .preview .item .val {
    font-family: 'Poppins', sans-serif;
    font-size: 18px;
    font-weight: 700;
    color: #f8fafc;
  }
  .preview .item .val.profit { color: #4ade80; }
  .preview .divider {
    width: 1px;
    height: 32px;
    background: rgba(255,255,255,0.1);
  }

  button {
    width: 100%;
    padding: 16px;
    margin-top: 20px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #06b6d4 100%);
    background-size: 200% 200%;
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.3px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(124, 58, 237, 0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  button:active {
    transform: scale(0.97);
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.3);
  }
  button:disabled {
    background: #3f3f5a;
    box-shadow: none;
    color: #8b8ba7;
  }

  .msg {
    text-align: center;
    margin-top: 14px;
    font-size: 13px;
    font-weight: 600;
    min-height: 18px;
    transition: opacity 0.2s ease;
  }
  .msg.ok { color: #4ade80; }
  .msg.err { color: #f87171; }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: #565676;
    margin-top: 20px;
  }

  @keyframes pop {
    0% { transform: scale(1); }
    50% { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  .pop { animation: pop 0.3s ease; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="badge">⚡ Live Ledger</div>
      <h1>Store Entry</h1>
      <p>Naya sale record karein, profit khud calculate hoga</p>
    </div>

    <div class="card" id="card">
      <div class="field">
        <label>Product Name</label>
        <div class="input-wrap">
          <span class="icon">🏷️</span>
          <input type="text" id="product" placeholder="e.g. Sugar 1kg" autocomplete="off">
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Quantity</label>
          <div class="input-wrap">
            <span class="icon">📦</span>
            <input type="number" id="qty" placeholder="0" inputmode="decimal">
          </div>
        </div>
        <div class="field">
          <label>Cost Price</label>
          <div class="input-wrap">
            <span class="icon">💵</span>
            <input type="number" id="cost" placeholder="0" inputmode="decimal">
          </div>
        </div>
      </div>

      <div class="field">
        <label>Selling Price (per unit)</label>
        <div class="input-wrap">
          <span class="icon">💰</span>
          <input type="number" id="sell" placeholder="0" inputmode="decimal">
        </div>
      </div>

      <div class="preview" id="preview">
        <div class="item">
          <div class="lbl">Total Sale</div>
          <div class="val" id="totalSale">Rs 0</div>
        </div>
        <div class="divider"></div>
        <div class="item">
          <div class="lbl">Profit</div>
          <div class="val profit" id="totalProfit">Rs 0</div>
        </div>
      </div>

      <button id="submitBtn" onclick="submitEntry()">Save Entry</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="footer-note">Qadeer Automations · Store Ledger</div>
  </div>

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyUA7NWk65yVMN3T5OeZuET_TzSqZYIZXp9uXfrXKovCIN3aiS-_O4yxSoQ6TjnUC8O/exec";

  const qtyEl = document.getElementById('qty');
  const costEl = document.getElementById('cost');
  const sellEl = document.getElementById('sell');
  const totalSaleEl = document.getElementById('totalSale');
  const totalProfitEl = document.getElementById('totalProfit');
  const previewEl = document.getElementById('preview');

  function updatePreview() {
    const qty = parseFloat(qtyEl.value) || 0;
    const cost = parseFloat(costEl.value) || 0;
    const sell = parseFloat(sellEl.value) || 0;
    const totalSale = qty * sell;
    const totalProfit = (sell - cost) * qty;
    totalSaleEl.textContent = "Rs " + totalSale.toFixed(0);
    totalProfitEl.textContent = "Rs " + totalProfit.toFixed(0);
    previewEl.classList.remove('pop');
    void previewEl.offsetWidth;
    previewEl.classList.add('pop');
  }
  [qtyEl, costEl, sellEl].forEach(el => el.addEventListener('input', updatePreview));

  async function submitEntry() {
    const product = document.getElementById('product').value.trim();
    const qty = parseFloat(qtyEl.value);
    const cost = parseFloat(costEl.value);
    const sell = parseFloat(sellEl.value);
    const msg = document.getElementById('msg');
    const btn = document.getElementById('submitBtn');

    if (!product || !qty || !cost || !sell) {
      msg.textContent = "Sab fields bharein.";
      msg.className = "msg err";
      return;
    }
    if (SCRIPT_URL.includes("PASTE_YOUR")) {
      msg.textContent = "Pehle SCRIPT_URL set karein (setup guide dekhein).";
      msg.className = "msg err";
      return;
    }

    btn.disabled = true;
    btn.textContent = "Saving...";
    msg.textContent = "";

    try {
      const now = new Date();
      const dateStr = now.toISOString().split('T')[0];

      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          date: dateStr,
          product: product,
          quantity: qty,
          costPrice: cost,
          sellingPrice: sell
        })
      });

      msg.textContent = "✅ Entry saved!";
      msg.className = "msg ok";
      document.getElementById('product').value = "";
      qtyEl.value = "";
      costEl.value = "";
      sellEl.value = "";
      updatePreview();
    } catch (err) {
      msg.textContent = "❌ Error: " + err.message;
      msg.className = "msg err";
    } finally {
      btn.disabled = false;
      btn.textContent = "Save Entry";
    }
  }
</script>
</body>
</html>
